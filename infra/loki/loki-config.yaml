# حالت Single Binary با ذخیره‌سازی محلی روی دیسک (Filesystem) -- فقط برای توسعه‌ی محلی،
# نه Production (طبق مستندات رسمی Loki: این حالت برای تست محلی است، Deployment واقعی به
# Object Storage نیاز دارد -- موضوع فازهای Deployment بعدی، نه این فاز).
# مستقیماً بر پایه‌ی cmd/loki/loki-local-config.yaml رسمی (grafana/loki، بررسی‌شده در همین فاز).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
  grpc_server_max_concurrent_streams: 1000

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  metric_aggregation_enabled: true

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: localhost:3100

frontend:
  encoding: protobuf

analytics:
  reporting_enabled: false

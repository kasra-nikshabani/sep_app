# «نام کاربری» در Fan ID همان کد ملی است (docs/adr/0024)؛ بقیه‌ی متن‌ها از ترجمه‌ی فارسی خود Keycloak می‌آید.
username=کد ملی
usernameOrEmail=کد ملی یا ایمیل
invalidUserMessage=کد ملی یا گذرواژه نادرست است.
invalidUsernameMessage=کد ملی نامعتبر است.
missingUsernameMessage=لطفاً کد ملی را وارد کنید.
usernameExistsMessage=با این کد ملی قبلاً حساب ساخته شده است. اگر گذرواژه را فراموش کرده‌اید، از «فراموشی گذرواژه» استفاده کنید.

# محیط توسعه‌ی محلی (Development Only) — نه برای Production.
# استفاده: کپی .env.example به .env در همین پوشه، مقادیر را عوض کنید، سپس:
#   docker compose --env-file .env up -d
#
# سرویس‌ها: PostgreSQL (با دو دیتابیس مجزا: sepahan_app و keycloak)، Redis، Keycloak (Dev Mode).
# پیکربندی Realm/Client کیکلوک هنوز اضافه نشده — موضوع Phase 4.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?لطفاً POSTGRES_SUPERUSER_PASSWORD را در .env تنظیم کنید}
      # فقط توسط infra/postgres/init/02-create-app-role.sh در اولین initdb خوانده می‌شود
      SEPAHAN_BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?لطفاً BACKEND_DB_PASSWORD را در .env تنظیم کنید}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?لطفاً REDIS_PASSWORD را در .env تنظیم کنید}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: keycloak/keycloak:26.7.1
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?لطفاً KEYCLOAK_ADMIN را در .env تنظیم کنید}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?لطفاً KEYCLOAK_ADMIN_PASSWORD را در .env تنظیم کنید}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?لطفاً KEYCLOAK_DB_PASSWORD را در .env تنظیم کنید}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # فایل Realm Export (Phase 4) — با --import-realm بالا در startup خوانده می‌شود
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # ایمیج Keycloak فاقد curl/wget است؛ از /dev/tcp خود Bash برای چک مسیر Health استفاده شده
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  redis_data:

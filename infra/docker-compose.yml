# محیط توسعه‌ی محلی (Development Only) — نه برای Production.
# استفاده: کپی .env.example به .env در همین پوشه، مقادیر را عوض کنید، سپس:
#   docker compose --env-file .env up -d
#
# سرویس‌ها: PostgreSQL (با دو دیتابیس مجزا: sepahan_app و keycloak)، Redis، Keycloak (Dev Mode)،
# Prometheus/Loki/Promtail/Grafana (Observability -- Phase 17، ADR-0019).
# پیکربندی Realm/Client کیکلوک هنوز اضافه نشده — موضوع Phase 4.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?لطفاً POSTGRES_SUPERUSER_PASSWORD را در .env تنظیم کنید}
      # فقط توسط infra/postgres/init/02-create-app-role.sh در اولین initdb خوانده می‌شود
      SEPAHAN_BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?لطفاً BACKEND_DB_PASSWORD را در .env تنظیم کنید}
    # فقط روی Loopback -- بدون Auth واقعی در سطح شبکه، انتشار روی همه‌ی Interfaceها یعنی هر
    # دستگاه دیگر روی همان شبکه (Wi-Fi مشترک، یک VM ابری با IP عمومی) می‌تواند وصل شود؛
    # کشف Phase 19 (Security Audit) -- هیچ‌کدام از این سرویس‌ها نیازی به دسترسی از بیرون
    # همین Host ندارند.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?لطفاً REDIS_PASSWORD را در .env تنظیم کنید}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: keycloak/keycloak:26.7.1
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?لطفاً KEYCLOAK_ADMIN را در .env تنظیم کنید}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?لطفاً KEYCLOAK_ADMIN_PASSWORD را در .env تنظیم کنید}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?لطفاً KEYCLOAK_DB_PASSWORD را در .env تنظیم کنید}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # فایل Realm Export (Phase 4) — با --import-realm بالا در startup خوانده می‌شود
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # ایمیج Keycloak فاقد curl/wget است؛ از /dev/tcp خود Bash برای چک مسیر Health استفاده شده
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    # Backend روی خودِ Host اجرا می‌شود (نه Container)، پس Prometheus باید بتواند از داخل
    # Container به پورت Host برسد -- host.docker.internal روی Docker Desktop خودکار کار
    # می‌کند، ولی روی Docker Engine خالص لینوکس (این محیط) نیاز به extra_hosts دارد.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # فقط روی Loopback -- Prometheus هیچ Auth داخلی ندارد (کشف Phase 19)؛ کوئری کامل Metricها
    # برای هرکسی که به این پورت برسد در دسترس است. محدودسازی تکمیلی سمت Backend هم در
    # SecurityConfig.java اضافه شد (فقط شبکه‌ی خصوصی/Loopback مجاز است).
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.6.11
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    # فقط روی Loopback -- هم‌دلیل Prometheus؛ Loki هم بدون Auth داخلی است و Logهای کامل
    # Backend را نگه می‌دارد (کشف Phase 19).
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/config.yaml", "-verify-config"]
      interval: 10s
      timeout: 5s
      retries: 10

  promtail:
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      # Log واقعی Backend روی Host نوشته می‌شود (backend/logs)، نه داخل یک Container --
      # همان دلیل extra_hosts بالا برای Prometheus.
      - ../backend/logs:/var/log/backend:ro
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.1.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?لطفاً GRAFANA_ADMIN_PASSWORD را در .env تنظیم کنید}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # عمداً یک Mount واحد -- تودرتو کردن یک Bind Mount دوم داخل یک Mount فقط-خواندنی
      # (provisioning/dashboards/json به‌عنوان مسیر جدا) روی این نسخه‌ی Docker با خطای
      # «read-only file system» شکست می‌خورد؛ چون همه‌چیز اکنون زیر یک درخت است، این مشکل
      # رخ نمی‌دهد.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      # ۳۰۰۰ عمداً استفاده نشد -- Admin Panel (Phase 14) هم پیش‌فرض همان پورت را می‌خواهد
      - "${GRAFANA_PORT:-3030}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:

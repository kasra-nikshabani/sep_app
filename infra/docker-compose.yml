# محیط توسعه‌ی محلی (Development Only) — نه برای Production.
# استفاده: کپی .env.example به .env در همین پوشه، مقادیر را عوض کنید، سپس:
#   docker compose --env-file .env up -d
#
# سرویس‌ها: PostgreSQL (با دو دیتابیس مجزا: sepahan_app و keycloak)، Redis، Keycloak (Dev Mode).
# پیکربندی Realm/Client کیکلوک هنوز اضافه نشده — موضوع Phase 4.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?لطفاً POSTGRES_SUPERUSER_PASSWORD را در .env تنظیم کنید}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?لطفاً REDIS_PASSWORD را در .env تنظیم کنید}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?لطفاً KEYCLOAK_ADMIN را در .env تنظیم کنید}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?لطفاً KEYCLOAK_ADMIN_PASSWORD را در .env تنظیم کنید}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?لطفاً KEYCLOAK_DB_PASSWORD را در .env تنظیم کنید}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # محل Import شدن Realm Export در Phase 4 — فعلاً خالی
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

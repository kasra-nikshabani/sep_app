server:
  port: 8081

spring:
  application:
    name: sepapp-backend

  datasource:
    url: jdbc:postgresql://localhost:${INFRA_POSTGRES_PORT:5433}/sepahan_app
    username: sepahan_backend
    password: ${BACKEND_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    schemas: public,users,fan,ticketing,payments
    default-schema: public

  data:
    redis:
      host: localhost
      port: ${INFRA_REDIS_PORT:6380}
      password: ${INFRA_REDIS_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${INFRA_KEYCLOAK_PORT:8080}/realms/sepahan

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ---- Payment (ADR-0011) ----
sepahan:
  payments:
    provider: fake # fake | zibal -- عمداً پیش‌فرض fake تا هیچ تماس شبکه‌ای ناخواسته‌ای رخ ندهد
    callback-base-url: http://localhost:${server.port}
    zibal:
      base-url: https://gateway.zibal.ir
      merchant: zibal # مرچنت تستی عمومی خود Zibal (طبق ADR-0011)؛ قبل از Production باید Merchant واقعی جایگزین شود

resilience4j:
  circuitbreaker:
    instances:
      zibal:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      zibal:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    instances:
      zibal:
        timeout-duration: 8s

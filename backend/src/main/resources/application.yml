server:
  port: 8081

spring:
  application:
    name: sepapp-backend

  datasource:
    url: jdbc:postgresql://localhost:${INFRA_POSTGRES_PORT:5433}/sepahan_app
    username: sepahan_backend
    password: ${BACKEND_DB_PASSWORD}
    hikari:
      # پیش‌فرض HikariCP (۱۰) کافی نبود: الگوی JIT Provisioning (users/loyalty) از
      # Propagation.REQUIRES_NEW واقعی استفاده می‌کند -- هر فراخوانی هم‌زمان حین اجرای بخش
      # REQUIRES_NEW تا دو Connection هم‌زمان لازم دارد (یکی Transaction بیرونی معلق، یکی
      # Transaction تازه). کشف واقعی در Phase 16: تست هم‌زمانی موجود Loyalty (اصلاً ۲۰ Thread،
      # تا ۱۰ کاهش یافت -- رجوع به LoyaltyAccountServiceTest) با Pool پیش‌فرض به Timeout واقعی
      # می‌رسید. Postgres این Instance تا ۱۰۰ Connection را پشتیبانی می‌کند (docker exec ... SHOW
      # max_connections)، پس ۳۰ همچنان محافظه‌کارانه است.
      maximum-pool-size: 30

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    schemas: public,users,fan,ticketing,payments,shop,news,loyalty,notifications,partners
    default-schema: public

  mail:
    # فقط وقتی sepahan.notifications.email.provider=smtp باشد واقعاً استفاده می‌شود (ADR-0015)
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    redis:
      host: localhost
      port: ${INFRA_REDIS_PORT:6380}
      password: ${INFRA_REDIS_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${INFRA_KEYCLOAK_PORT:8080}/realms/sepahan

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # پیش‌فرض Email این پروژه fake است (بدون SMTP واقعی) -- Health خود برنامه
    # نباید به در دسترس‌بودن یک SMTP واقعی که عمداً استفاده نمی‌شود وابسته باشد
    # (کشف‌شده در Phase 14: Actuator با spring-boot-starter-mail به‌صورت خودکار
    # این Health Indicator را فعال می‌کند).
    mail:
      enabled: false

# ---- Payment (ADR-0011) / Shop (ADR-0012) / News (ADR-0013) ----
# نکته: همه‌ی این‌ها زیر یک کلید ریشه‌ی sepahan هستند -- دو بلوک sepahan جدا در یک
# فایل YAML باعث می‌شود پارسر (SnakeYAML) دومی را جایگزین اولی کند، نه Merge (یک
# باگ واقعی که در Phase 10، قبل از اجرا، در ویرایش همین فایل پیش آمد).
sepahan:
  cors:
    # طبق کشف Phase 15: برخلاف Admin Panel (الگوی BFF -- مرورگر هرگز مستقیم
    # این API را صدا نمی‌زند)، اپ موبایل خودش مستقیماً با Bearer Token تماس
    # می‌گیرد؛ نسخه‌ی Web آن (فقط برای Preview/تست در این پروژه، طبق
    # docs/adr/0017-mobile-app.md) یک مرورگر واقعی است و CORS لازم دارد.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:19006}
  payments:
    provider: fake # fake | zibal -- عمداً پیش‌فرض fake تا هیچ تماس شبکه‌ای ناخواسته‌ای رخ ندهد
    callback-base-url: http://localhost:${server.port}
    zibal:
      base-url: https://gateway.zibal.ir
      merchant: zibal # مرچنت تستی عمومی خود Zibal (طبق ADR-0011)؛ قبل از Production باید Merchant واقعی جایگزین شود
  shop:
    order-ttl-seconds: 1800 # مهلت پرداخت سفارش قبل از آزادسازی خودکار موجودی
    cleanup-interval-ms: 60000
  news:
    media:
      storage-path: ${INFRA_NEWS_MEDIA_PATH:./data/news-media} # دیسک محلی -- تصمیم صریح کارفرما (ADR-0013)
      public-base-url: http://localhost:${server.port}/media
      allowed-content-types: image/jpeg,image/png,image/webp,image/gif
    publish-check-interval-ms: 60000
  loyalty:
    django:
      base-url: ${INFRA_DJANGO_BASE_URL:http://localhost:8000} # ticket.sepahansc/football_tickets
      service-token: ${LOYALTY_DJANGO_SERVICE_TOKEN}
      poll-interval-ms: 300000 # هر ۵ دقیقه -- طبق تصمیم صریح کارفرما، Polling نه Webhook (ADR-0014)
      initial-lookback-days: 1 # اولین اجرا بعد از Deploy این ماژول -- فقط ۱ روز قبل، نه کل تاریخچه
  notifications:
    sms:
      provider: fake # fake | sms_ir -- عمداً پیش‌فرض fake تا هیچ تماس شبکه‌ای/هزینه‌ی واقعی رخ ندهد
      sms-ir:
        base-url: https://api.sms.ir/v1
        api-key: ${SMS_IR_API_KEY:}
        line-number: ${SMS_IR_LINE_NUMBER:0}
    email:
      provider: fake # fake | smtp
      smtp:
        from: ${SMTP_FROM_ADDRESS:no-reply@sepahansc.com}
    push:
      provider: fake # fake | fcm -- عمداً پیش‌فرض fake؛ fcm نیازمند یک پروژه‌ی Firebase واقعی است (ADR-0018)
      fcm:
        service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:} # مسیر فایل JSON کلید Service Account -- هرگز در Git نیست

resilience4j:
  circuitbreaker:
    instances:
      zibal:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
      sms_ir:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
      fcm:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      zibal:
        max-attempts: 3
        wait-duration: 500ms
      sms_ir:
        max-attempts: 3
        wait-duration: 500ms
      fcm:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    instances:
      zibal:
        timeout-duration: 8s
      sms_ir:
        timeout-duration: 8s
      fcm:
        timeout-duration: 8s
